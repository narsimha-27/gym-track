<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Member')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main>
    <h1 th:text="${member.id == null} ? 'New member' : 'Edit member'">New member</h1>
    <div class="card" style="max-width:520px">
        <form th:action="@{/members}" th:object="${member}" method="post">
            <input type="hidden" th:field="*{id}">

            <label>Name</label>
            <input th:field="*{name}">
            <span class="err" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>

            <label>Phone (10 digits)</label>
            <input th:field="*{phone}">
            <span class="err" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>

            <label>Email (optional)</label>
            <input th:field="*{email}">
            <span class="err" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>

            <p>
                <button class="btn" type="submit">Save</button>
                <a class="btn secondary" th:href="@{/members}">Cancel</a>
            </p>
        </form>
    </div>
</main>
</body>
</html>
