<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | GymTrack'">GymTrack</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="manifest" th:href="@{/manifest.json}">
    <link rel="icon" type="image/svg+xml" th:href="@{/icon.svg}">
    <meta name="theme-color" content="#14151b">
</head>
<body>
<nav th:fragment="nav" class="sidebar">
    <style>
        .timing { background: #1d1e26; border: 1px solid #2f3140; border-radius: 12px; padding: 12px; margin-bottom: 10px;
                  font-size: 12px; color: #9ca3af; }
        .timing .st { display: flex; align-items: center; gap: 8px; color: #f3f4f6; font-weight: 600; font-size: 13px; margin-bottom: 8px; }
        .timing .dot { width: 9px; height: 9px; border-radius: 50%; background: #6b7280; }
        .timing .dot.open { background: #22c55e; }
        .timing .dot.closed { background: #ef4444; }
        .timing b { display: block; color: #f3f4f6; font-weight: 600; }
    </style>
    <div class="brand">&#127947; Gym<span>Track</span></div>
    <a class="nav-link" th:href="@{/}">&#128202;&nbsp; Dashboard</a>
    <a class="nav-link" th:href="@{/members}">&#128101;&nbsp; Members</a>
    <a class="nav-link" th:href="@{/plans}">&#128179;&nbsp; Plans</a>
    <a class="nav-link" th:href="@{/attendance}">&#9989;&nbsp; Attendance</a>
    <a class="nav-link" th:href="@{/analytics}">&#128200;&nbsp; Analytics</a>
    <div class="side-foot">
        <div class="timing">
            <div class="st">
                <span th:class="${gymOpen} ? 'dot open' : 'dot closed'"></span>
                <span th:text="${gymOpen} ? 'Open now' : 'Closed now'">Open now</span>
            </div>
            <div>Morning<b th:text="${morningHours}">6:00 AM - 11:00 AM</b></div>
            <div style="margin-top:6px">Evening<b th:text="${eveningHours}">4:00 PM - 9:00 PM</b></div>
        </div>
        <form th:action="@{/admin/logout}" method="post">
            <button class="btn secondary" type="submit" style="width:100%">&#128682;&nbsp; Log out</button>
        </form>
    </div>
    <script>
        (function () {
            var p = location.pathname;
            document.querySelectorAll('.sidebar a.nav-link').forEach(function (a) {
                var h = a.getAttribute('href');
                if (h === '/' ? p === '/' : p.indexOf(h) === 0) a.classList.add('active');
            });
        })();
    </script>
</nav>
<div th:fragment="flash">
    <div class="alert success" th:if="${success}" th:text="${success}"></div>
    <div class="alert error" th:if="${error}" th:text="${error}"></div>
</div>
</body>
</html>
