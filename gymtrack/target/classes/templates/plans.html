<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Plans')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main>
    <h1>Membership plans</h1>
    <div th:replace="~{fragments :: flash}"></div>

    <div class="card">
        <table>
            <tr><th>Plan</th><th>Duration</th><th>Price</th><th></th></tr>
            <tr th:each="p : ${plans}">
                <td th:text="${p.name}"></td>
                <td th:text="${p.durationMonths + ' month(s)'}"></td>
                <td th:text="${'Rs ' + p.price}"></td>
                <td>
                    <form class="inline" th:action="@{/plans/{id}/delete(id=${p.id})}" method="post"
                          onsubmit="return confirm('Delete this plan?')">
                        <button class="btn danger small" type="submit">Delete</button>
                    </form>
                </td>
            </tr>
        </table>
    </div>

    <div class="card">
        <h2>Add a plan</h2>
        <form th:action="@{/plans}" th:object="${plan}" method="post">
            <div class="row">
                <div><label>Name</label><input th:field="*{name}">
                    <span class="err" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span></div>
                <div><label>Duration (months)</label><input type="number" min="1" th:field="*{durationMonths}">
                    <span class="err" th:if="${#fields.hasErrors('durationMonths')}" th:errors="*{durationMonths}"></span></div>
                <div><label>Price (Rs) - calculated automatically</label><input type="number" step="0.01" th:field="*{price}">
                    <span class="err" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></span></div>
                <button class="btn" type="submit">Add</button>
            </div>
            <p class="muted" style="font-size:13px">
                Rule: Rs 1000 per month, 10% off for 3+ months, 20% off for 12+ months. You can still edit the price if needed.
            </p>
        </form>
    </div>
</main>

<script>
    (function () {
        var months = document.getElementById('durationMonths');
        var price = document.getElementById('price');

        function updatePrice() {
            var m = parseInt(months.value, 10);
            if (!m || m < 1) { price.value = ''; return; }
            fetch('/plans/price?months=' + m)
                .then(function (r) { return r.ok ? r.text() : ''; })
                .then(function (text) { if (text) price.value = text; });
        }

        months.addEventListener('input', updatePrice);
        if (!price.value) updatePrice();
    })();
</script>
</body>
</html>
