spring.application.name=GymTrack
server.port=8080

# ---- Default: H2 file database (no setup needed, data survives restarts) ----
spring.datasource.url=jdbc:h2:file:./data/gymdb
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update

# ---- To use MySQL instead, comment the H2 lines above and uncomment these ----
# spring.datasource.url=jdbc:mysql://localhost:3306/gymdb?createDatabaseIfNotExist=true
# spring.datasource.username=root
# spring.datasource.password=your_password
# spring.jpa.hibernate.ddl-auto=update
